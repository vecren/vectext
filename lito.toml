[package]
name = "vectext"
version = "0.1.0"
authors = ["hypengw <hypengwip@gmail.com>"]
license = "MIT OR Apache-2.0"

[lib]
name = "vectext"
module = "vectext"
archive = "vectext"

[profile.base]
exceptions = false
rtti = false

[dependencies]
rstd-std = { version = "0.1.5", pub = true }
rstd-nostd = { version = "0.1.5", usage = "link" }

[external-dependencies.pkg-config]
fontconfig = { module = "fontconfig", version = ">= 2.14", pub = true, condition = 'target.os != "macos"' }
freetype = { module = "freetype2", version = ">= 24.3", pub = true, condition = 'target.os != "macos"' }

[[when]]
condition = 'target.os == "macos"'
[when.usage]
frameworks = ["CoreFoundation", "CoreText", "CoreGraphics"]
