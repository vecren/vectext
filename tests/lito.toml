[package]
name = "vectext-tests"

[profile.base]
exceptions = false
rtti = false

[dependencies]
vectext = { path = ".." }
rstd-test = { version = "0.1.5" }
rstd-nostd = { version = "0.1.5", usage = "link" }

[[test]]
name = "vectext"
sources = ["lib.cppm", "main.cpp", "text.cpp", "fonts.cpp", "unicode.cpp", "boundaries.cpp", "performance.cpp", "platform.cpp"]
link-stdlib = false

[[test.attach]]
package = "vectext"
sources = ["internal.cpp"]
